<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.webmanifest">
<title>مترجم الاجتماعات</title>
<style>
  :root { --bg:#f6f7f9; --card:#ffffff; --text:#111; --muted:#666; --accent:#1f6feb; --danger:#d93025; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#111; --card:#1c1c1e; --text:#eee; --muted:#999; }
  }
  :root[data-theme="dark"] { --bg:#111; --card:#1c1c1e; --text:#eee; --muted:#999; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { padding: 16px; font-weight: 700; font-size: 20px; text-align: center; }
  nav { display:flex; gap:8px; padding: 0 16px; }
  nav button { flex:1; padding:12px; border:0; border-radius:12px; background: var(--card); color: var(--text); font-size:15px; }
  nav button.active { background: var(--accent); color:#fff; }
  main { padding: 16px; }
  .card { background: var(--card); border-radius:16px; padding:16px; margin-bottom:12px; }
  .label { font-size:13px; color: var(--muted); margin-bottom:6px; }
  .big { font-size:22px; line-height:1.5; min-height:34px; white-space: pre-wrap; word-wrap: break-word; }
  .mic { width:100%; padding:20px; border:0; border-radius:16px; background: var(--accent); color:#fff; font-size:18px; font-weight:700; }
  .mic.rec { background: var(--danger); }
  .sm { padding:10px 14px; border:0; border-radius:10px; background: var(--accent); color:#fff; font-size:15px; }
  .sm:disabled { opacity:.5; }
  .sm.grey { background: var(--muted); }
  textarea, select { width:100%; padding:12px; border-radius:12px; border:1px solid #bbb; font-size:16px; background: var(--card); color: var(--text); font-family: inherit; }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .opt { display:flex; align-items:center; gap:10px; font-size:17px; }
  .opt input { width:22px; height:22px; }
  .hidden { display:none; }
  .status { font-size:14px; color: var(--muted); text-align:center; margin:10px 0; min-height:20px; }
  .ltr { direction:ltr; text-align:left; }
  .err { color: var(--danger); }
</style>
</head>
<body>
<header>مترجم الاجتماعات</header>

<nav>
  <button id="tabListen" class="active">بسمع: إنجليزي ← عربي</button>
  <button id="tabSpeak">بتكلم: عربي ← إنجليزي</button>
</nav>

<main>
  <!-- وضع الاستماع -->
  <section id="listen">
    <button id="listenBtn" class="mic">🎤 اضغط واتكلم (إنجليزي)</button>
    <div class="status" id="listenStatus"></div>

    <div class="card">
      <div class="label">الإنجليزي</div>
      <div class="big ltr" id="enText"></div>
    </div>

    <div class="card">
      <div class="label">الترجمة بالعربي</div>
      <div class="big" id="arText"></div>
      <div class="row">
        <button class="sm" id="speakAr">🔊 اسمع العربي</button>
        <button class="sm grey" id="clearListen">مسح</button>
      </div>
    </div>
  </section>

  <!-- وضع الكلام -->
  <section id="speak" class="hidden">
    <button id="speakBtn" class="mic">🎤 اضغط واتكلم (عربي)</button>
    <div class="status" id="speakStatus"></div>

    <div class="card">
      <div class="label">اللي قلته بالعربي</div>
      <div class="big" id="arLog"></div>
      <textarea id="arInput" rows="2" placeholder="أو اكتب هنا واضغط ترجم"></textarea>
      <div class="row">
        <button class="sm" id="sendAr">ترجم المكتوب</button>
        <button class="sm grey" id="clearSpeak">مسح</button>
      </div>
    </div>

    <div class="card">
      <div class="label">الإنجليزي</div>
      <div class="big ltr" id="outEn"></div>
      <div class="row">
        <button class="sm" id="playEn">🔊 قولها تاني</button>
        <button class="sm grey" id="copyEn">نسخ</button>
      </div>
    </div>

    <div class="card">
      <label class="opt"><input type="checkbox" id="ttsOn" checked> 🔊 اقرا الإنجليزي بصوت عالي</label>
      <div class="label" style="margin-top:12px">صوت الإنجليزي</div>
      <select id="voiceSel"></select>
      <div class="label" style="margin-top:12px">نبرة الصوت (كل ما تقل الرقم، الصوت يبقى أخشن)</div>
      <input type="range" id="pitch" min="0.4" max="1.2" step="0.05" value="0.7" style="width:100%">
      <div class="row">
        <button class="sm" id="testVoice">🔊 جرّب الصوت</button>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ===== التبويبات =====
  function show(name) {
    $('tabListen').classList.toggle('active', name === 'listen');
    $('tabSpeak').classList.toggle('active', name === 'speak');
    $('listen').classList.toggle('hidden', name !== 'listen');
    $('speak').classList.toggle('hidden', name !== 'speak');
  }
  $('tabListen').onclick = () => show('listen');
  $('tabSpeak').onclick = () => show('speak');

  // ===== تخزين بسيط على الموبايل (لو متاح) =====
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  // ===== الكلام (Text to Speech) =====
  function speakAr(text) {
    if (!('speechSynthesis' in window) || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ar-EG';
    u.volume = 1;
    u.rate = 0.95;
    speechSynthesis.speak(u);
  }

  // الإنجليزي: بيتقال من غير ما يقطع اللي قبله، وبالصوت والنبرة المختارين
  function speakEn(text, cancelFirst) {
    if (!('speechSynthesis' in window) || !text) return;
    if (cancelFirst) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.volume = 1;
    u.rate = 0.95;
    u.pitch = parseFloat($('pitch').value) || 0.7;
    const name = $('voiceSel').value;
    const v = speechSynthesis.getVoices().find(x => x.name === name);
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
    speechSynthesis.speak(u);
  }

  // ===== اختيار صوت الإنجليزي (ذكوري كاختيار افتراضي) =====
  const MALE_HINT = /male|david|mark|daniel|james|guy|tom|george|fred|alex/i;
  function fillVoices() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    if (!vs.length) return;
    const sel = $('voiceSel');
    const saved = store.get('enVoice');
    sel.innerHTML = '';
    vs.forEach(v => {
      const o = document.createElement('option');
      o.value = v.name;
      o.textContent = v.name + ' (' + v.lang + ')';
      sel.appendChild(o);
    });
    const pick = vs.find(v => v.name === saved)
      || vs.find(v => MALE_HINT.test(v.name))
      || vs[0];
    sel.value = pick.name;
  }
  $('voiceSel').onchange = () => store.set('enVoice', $('voiceSel').value);
  $('pitch').value = store.get('enPitch') || '0.7';
  $('pitch').onchange = () => store.set('enPitch', $('pitch').value);
  $('testVoice').onclick = () => speakEn('Hello, this is a test of my voice. How are you today?', true);
  if ('speechSynthesis' in window) {
    fillVoices();
    speechSynthesis.onvoiceschanged = fillVoices;
  }

  // خيار تشغيل الصوت (محفوظ)
  $('ttsOn').checked = store.get('ttsOn') !== '0';
  $('ttsOn').onchange = () => store.set('ttsOn', $('ttsOn').checked ? '1' : '0');

  // ===== التعرف على الصوت (Speech to Text) =====
  // وضع الاستماع: جملة وحدة لكل ضغطة
  function makeRec(lang, onInterim, onFinal, onEnd) {
    if (!SR) {
      alert('المتصفح ده مش بيدعم التعرف على الصوت. افتح الصفحة من Chrome على Android.');
      return null;
    }
    const r = new SR();
    r.lang = lang;
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    r.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t; else interim += t;
      }
      if (interim) onInterim(interim.trim());
      if (final.trim()) onFinal(final.trim());
    };
    r.onerror = (e) => onEnd(e.error);
    r.onend = () => onEnd(null);
    return r;
  }

  // ===== الترجمة المجانية =====
  // 1) Google (الأحسن)، 2) MyMemory كبديل لو Google وقع
  async function translateGoogle(text, from, to) {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&dt=t'
      + '&sl=' + from + '&tl=' + to + '&q=' + encodeURIComponent(text);
    const r = await fetch(url);
    if (!r.ok) throw new Error('google ' + r.status);
    const data = await r.json();
    const out = (data[0] || []).map(seg => seg[0] || '').join('');
    if (!out) throw new Error('google empty');
    return out;
  }

  async function translateMyMemory(text, from, to) {
    const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text)
      + '&langpair=' + from + '|' + to;
    const r = await fetch(url);
    if (!r.ok) throw new Error('mymemory ' + r.status);
    const j = await r.json();
    const out = j.responseData && j.responseData.translatedText;
    if (!out || j.quotaFinished) throw new Error('mymemory unavailable');
    return out;
  }

  async function translate(text, from, to) {
    try {
      return await translateGoogle(text, from, to);
    } catch (e) {
      return await translateMyMemory(text, from, to);
    }
  }

  // ===== وضع الاستماع: إنجليزي ← عربي =====
  let listenRec = null;
  let enBuf = '';
  let arBuf = '';
  let listening = false;

  function setListenUI(on) {
    listening = on;
    $('listenBtn').textContent = on ? '⏹ وقف' : '🎤 اضغط واتكلم (إنجليزي)';
    $('listenBtn').classList.toggle('rec', on);
    if (!on) $('listenStatus').textContent = '';
  }

  $('listenBtn').onclick = () => {
    if (listening) { listenRec && listenRec.stop(); return; }
    listenRec = makeRec('en-US',
      (interim) => { $('listenStatus').textContent = interim; },
      async (finalText) => {
        enBuf = (enBuf + ' ' + finalText).trim();
        $('enText').textContent = enBuf;
        try {
          const arabic = await translate(finalText, 'en', 'ar');
          arBuf = (arBuf + ' ' + arabic).trim();
          $('arText').textContent = arBuf;
          $('listenStatus').textContent = '';
          $('listenStatus').classList.remove('err');
        } catch (e) {
          $('listenStatus').textContent = 'حصل خطأ في الترجمة، جرّب تاني';
          $('listenStatus').classList.add('err');
        }
      },
      () => setListenUI(false)
    );
    if (!listenRec) return;
    setListenUI(true);
    listenRec.start();
  };

  $('speakAr').onclick = () => speakAr(arBuf);
  $('clearListen').onclick = () => {
    enBuf = ''; arBuf = '';
    $('enText').textContent = ''; $('arText').textContent = '';
  };

  // ===== وضع الكلام: عربي ← إنجليزي (مستمر) =====
  let speakActive = false;
  let speakRec = null;
  let speakChain = Promise.resolve();   // الترجمات بتتنفذ بالترتيب
  let enAll = '';
  let lastEnChunk = '';

  function setSpeakUI(on) {
    speakActive = on;
    $('speakBtn').textContent = on ? '⏹ وقف' : '🎤 اضغط واتكلم (عربي)';
    $('speakBtn').classList.toggle('rec', on);
    if (!on) $('speakStatus').textContent = '';
  }

  // بيترجم كل جزء بعد ما تسكت، من غير ما يستنى الجملة كلها
  function queueChunk(ar) {
    $('arLog').textContent = ($('arLog').textContent + ' ' + ar).trim();
    speakChain = speakChain.then(async () => {
      try {
        const en = await translate(ar, 'ar', 'en');
        lastEnChunk = en;
        enAll = (enAll + ' ' + en).trim();
        $('outEn').textContent = enAll;
        $('speakStatus').classList.remove('err');
        if ($('ttsOn').checked) speakEn(en, false);
      } catch (e) {
        $('speakStatus').textContent = 'حصل خطأ في الترجمة، جرّب تاني';
        $('speakStatus').classList.add('err');
      }
    });
  }

  function startSpeakRec() {
    if (!SR) {
      alert('المتصفح ده مش بيدعم التعرف على الصوت. افتح الصفحة من Chrome على Android.');
      setSpeakUI(false);
      return;
    }
    const r = new SR();
    r.lang = 'ar-EG';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    r.onresult = (e) => {
      // لو الصوت الإنجليزي شغال، منسمعش عشان ما يترجمش نفسه
      if ('speechSynthesis' in window && speechSynthesis.speaking) return;
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t; else interim += t;
      }
      if (interim) $('speakStatus').textContent = interim.trim();
      if (final.trim()) {
        $('speakStatus').textContent = '';
        queueChunk(final.trim());
      }
    };
    r.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        setSpeakUI(false);
        $('speakStatus').textContent = 'الميكروفون مش متسمح به';
        $('speakStatus').classList.add('err');
      }
    };
    r.onend = () => {
      // Chrome بيقفل التعرف بعد فترة سكوت، فبنفتحه تاني لو الوضع لسه شغال
      if (!speakActive) return;
      setTimeout(() => { if (speakActive) { try { r.start(); } catch (e) {} } }, 250);
    };
    speakRec = r;
    try { r.start(); } catch (e) { setSpeakUI(false); }
  }

  $('speakBtn').onclick = () => {
    if (speakActive) {
      setSpeakUI(false);
      if (speakRec) speakRec.stop();
      return;
    }
    setSpeakUI(true);
    startSpeakRec();
  };

  $('sendAr').onclick = () => {
    const text = $('arInput').value.trim();
    if (!text) return;
    $('arInput').value = '';
    queueChunk(text);
  };

  $('clearSpeak').onclick = () => {
    enAll = ''; lastEnChunk = '';
    $('outEn').textContent = '';
    $('arLog').textContent = '';
  };

  $('playEn').onclick = () => speakEn(enAll, true);

  $('copyEn').onclick = async () => {
    if (!enAll) return;
    try {
      await navigator.clipboard.writeText(enAll);
      $('copyEn').textContent = 'اتنسخ ✓';
      setTimeout(() => { $('copyEn').textContent = 'نسخ'; }, 1500);
    } catch (e) {
      $('speakStatus').textContent = 'النسخ مش شغال، انسخ يدوي';
    }
  };

  // تسجيل Service Worker عشان يبقى التطبيق قابل للتثبيت
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
